<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosas que florecen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff3f5;--bg2:#ffc9d6;--accent:#c8123f;--star:#d9902a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#10030a;--bg2:#3a0b22;--accent:#ff3d6e;--star:#ffd98a}}
:root[data-theme="dark"]{--bg1:#10030a;--bg2:#3a0b22;--accent:#ff3d6e;--star:#ffd98a}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg2) linear-gradient(180deg,var(--bg1),var(--bg2))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Jardín de rosas: toca la pantalla para plantar hasta 10 rosas"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out=t=>1-Math.pow(1-t,3),TAU=Math.PI*2;
let W,H,DPR,base,roses=[],petals=[],sparks=[],blades=[],labels=[],wind=0,px=.5,tNow=0,star='#ffd98a',planted=0;
const HUES=[350,346,356,340,2,332];
const WORDS=["Te amo","Eres el amor de mi vida","Eres mi razón de sonreír","Contigo todo es hermoso","Mi corazón es tuyo","Eres mi lugar favorito","Te amo hasta el infinito","Gracias por existir","Quiero toda la vida contigo","Siempre tú, siempre yo"];
const MAX=WORDS.length;
document.fonts&&document.fonts.load('600 24px "Dancing Script"');

function mk(x,hgt,delay,size,hue,dur,word){
 return{fx:x/W,fh:hgt/H,dy:R(-4,6),x,y:base,h:hgt,delay,dur,size,hue,word,curve:R(-1,1)*hgt*.14,lean:R(-1,1)*hgt*.07,ph:R(0,6.28),done:0,
 leaves:[{u:.24,s:-1},{u:.42,s:1},{u:.6,s:-1}].map(l=>({...l,L:size*R(.95,1.3)}))};
}
function place(){roses.forEach(r=>{r.x=r.fx*W;r.y=base+r.dy;r.h=r.fh*H})}
function build(){
 blades=[];
 for(let i=0;i<W/5;i++)blades.push({x:R(0,W),h:R(10,38),ph:R(0,6.28),delay:R(.2,2.5),hue:R(105,140)});
 sparks=[];
 for(let i=0;i<46;i++)sparks.push({x:R(0,W),y:R(0,H*.9),r:R(.8,2.2),ph:R(0,6.28),sp:R(.4,1.2)});
}
function size(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);base=H*.955;
 star=getComputedStyle(document.documentElement).getPropertyValue('--star').trim()||star;
 place();build();scene();
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(size,150)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',size);

function stem(r,u,t){
 const a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u,k=reduce?0:1;
 return[a*r.x+b*(r.x+r.curve)+c*(r.x+r.lean)+(Math.sin(t*.9+r.ph)*7+wind*10)*u*u*k,
        a*r.y+b*(r.y-r.h*.5)+c*(r.y-r.h)];
}
function leaf(x,y,ang,L,Wd,c1,c2){
 g.save();g.translate(x,y);g.rotate(ang);
 const gr=g.createLinearGradient(0,0,L,0);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
 g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L*.5,-Wd,L,0);g.quadraticCurveTo(L*.5,Wd,0,0);g.fill();
 g.strokeStyle='rgba(190,255,200,.35)';g.lineWidth=.8;g.beginPath();g.moveTo(0,0);g.lineTo(L*.9,0);g.stroke();
 g.restore();
}
function bloomHead(r,b){
 const S=r.size*b;if(S<1)return;
 const gl=g.createRadialGradient(0,0,S*.2,0,0,S*2.3);
 gl.addColorStop(0,`hsla(${r.hue},90%,60%,${.38*b})`);gl.addColorStop(1,`hsla(${r.hue},90%,60%,0)`);
 g.fillStyle=gl;g.beginPath();g.arc(0,0,S*2.3,0,TAU);g.fill();
 const L=[[5,1,0],[5,.82,.6],[4,.62,.3],[4,.46,.9],[3,.31,.2],[3,.19,.7]];
 L.forEach(([cnt,f,off],k)=>{
  const ls=ease(clamp((b-(L.length-1-k)/L.length*.5)/.5));if(ls<=0)return;
  const rad=S*f*ls;
  for(let j=0;j<cnt;j++){
   const a=k*.9+off+j*TAU/cnt,d=rad*.5,x=Math.cos(a)*d,y=Math.sin(a)*d*.88,rx=rad*.62,ry=rad*.5;
   const pg=g.createRadialGradient(x+Math.cos(a)*rad*.15,y+Math.sin(a)*rad*.15,rad*.05,x,y,rx);
   pg.addColorStop(0,`hsl(${r.hue},85%,${56-k*2.5}%)`);pg.addColorStop(1,`hsl(${r.hue},85%,${27-k*1.5}%)`);
   g.fillStyle=pg;g.strokeStyle=`hsla(${r.hue},80%,16%,.4)`;g.lineWidth=.8;
   g.beginPath();g.ellipse(x,y,rx,ry,a,0,TAU);g.fill();g.stroke();
  }
 });
 const sp=ease(clamp((b-.1)/.5));
 g.strokeStyle=`hsla(${r.hue},85%,16%,.75)`;g.lineWidth=1;g.beginPath();
 for(let th=.4;th<13.5*sp;th+=.25){const rr=S*.0185*th;g.lineTo(Math.cos(th)*rr,Math.sin(th)*rr*.9)}
 g.stroke();
}
function rose(r,t){
 const p=reduce?1:clamp((t-r.delay)/r.dur);if(p<=0)return;
 const sp=out(clamp(p/.7)),bl=ease(clamp((p-.62)/.38)),lw=r.size*.11+1.5,N=30;
 g.lineCap='round';g.lineJoin='round';
 g.strokeStyle='#1f6b34';g.lineWidth=lw;g.beginPath();
 for(let k=0;k<=N;k++){const q=stem(r,sp*k/N,t);k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])}
 g.stroke();
 g.strokeStyle='rgba(120,220,140,.55)';g.lineWidth=lw*.3;g.beginPath();
 for(let k=0;k<=N;k++){const q=stem(r,sp*k/N,t);k?g.lineTo(q[0]-lw*.2,q[1]):g.moveTo(q[0]-lw*.2,q[1])}
 g.stroke();
 [.2,.36,.52,.7].forEach((u,i)=>{if(sp>u+.03){const q=stem(r,u,t),s=i%2?1:-1;
  g.fillStyle='#174f27';g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(q[0]+s*(lw+4),q[1]-4);g.lineTo(q[0],q[1]-7);g.fill()}});
 r.leaves.forEach(l=>{if(sp>l.u+.02){const gr=out(clamp((sp-l.u)/.25)),q=stem(r,l.u,t),sw=reduce?0:Math.sin(t*1.1+r.ph+l.u*5)*.06;
  leaf(q[0],q[1],(l.s<0?Math.PI+.55:-.55)+sw*l.s,l.L*gr,l.L*.32*gr,'#1c6a31','#53c06b')}});
 const h=stem(r,sp,t);
 g.save();g.translate(h[0],h[1]);g.rotate(reduce?0:Math.sin(t*.9+r.ph)*.04);
 const bs=r.size*(.3+.1*sp);
 leaf(0,0,Math.PI/2+.8,bs*2.6,bs*.5,'#1f6b34','#4bb463');leaf(0,0,Math.PI/2-.8,bs*2.6,bs*.5,'#1f6b34','#4bb463');
 g.fillStyle=`hsl(${r.hue},80%,32%)`;g.beginPath();g.ellipse(0,-bs*.2,bs*.8,bs*1.1,0,0,TAU);g.fill();
 bloomHead(r,bl);
 g.restore();
 if(bl>.6)labels.push([h[0],h[1]-r.size*1.5-14,r.word,ease(clamp((bl-.6)/.4)),t+r.ph]);
 if(bl>=1&&!r.done){r.done=1;
  if(!reduce)for(let i=0;i<(r.last?60:8);i++)spawn(h[0]+R(-30,30),h[1]+R(-20,20),r.hue)}
}
function label(x,y,txt,a,t){
 const fs=clamp(W/24,17,28),bob=reduce?0:Math.sin(t*1.6)*3;
 g.save();g.globalAlpha=a;g.font=`600 ${fs}px "Dancing Script","Brush Script MT",cursive`;
 const w=g.measureText(txt).width+30,hh=fs*1.55,dx=clamp(x,w/2+8,W-w/2-8)-x;
 g.translate(x+dx,y+bob-(1-a)*12);
 g.shadowColor=star;g.shadowBlur=18;g.fillStyle='rgba(255,246,249,.94)';
 g.beginPath();g.roundRect?g.roundRect(-w/2,-hh/2,w,hh,hh/2):g.rect(-w/2,-hh/2,w,hh);g.fill();
 g.shadowBlur=0;g.beginPath();g.moveTo(-dx-6,hh/2-1);g.lineTo(-dx+6,hh/2-1);g.lineTo(-dx,hh/2+7);g.fill();
 g.fillStyle='#a3103c';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,2);
 g.restore();
}
function spawn(x,y,hue,s){if(petals.length>160)return;
 petals.push({x,y,vx:R(-.8,.8),vy:R(.4,1.4),rot:R(0,6.28),vr:R(-.04,.04),s:s||R(5,10),hue:hue??HUES[(Math.random()*HUES.length)|0]})}
function ground(){
 const gr=g.createLinearGradient(0,base-30,0,H);gr.addColorStop(0,'rgba(18,70,34,0)');gr.addColorStop(.35,'rgba(18,70,34,.85)');gr.addColorStop(1,'rgba(8,36,18,1)');
 g.fillStyle=gr;g.fillRect(0,base-30,W,H-base+30);
}

let fo=null;
function scene(){ // bosque en capas, dibujado una sola vez
 fo=document.createElement('canvas');fo.width=W*DPR;fo.height=H*DPR;
 const c=fo.getContext('2d');c.scale(DPR,DPR);
 const hill=(y,amp,col,sd)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,H);
  for(let x=0;x<=W+20;x+=20)c.lineTo(x,y-amp*(Math.sin(x*.004+sd)+.6*Math.sin(x*.011+sd*2)+1.4));
  c.lineTo(W,H);c.fill()};
 const pine=(x,y,h,col)=>{c.fillStyle=col;c.fillRect(x-h*.03,y-h*.12,h*.06,h*.12);const w=h*.3;
  for(let i=0;i<4;i++){const ty=y-h*.1-i*h*.2,ww=w*(1-i*.2);c.beginPath();c.moveTo(x,ty-h*.3);c.lineTo(x-ww,ty);c.lineTo(x+ww,ty);c.fill()}};
 const oak=(x,y,h,col)=>{c.fillStyle='#5a3b2a';c.fillRect(x-h*.04,y-h*.45,h*.08,h*.45);c.fillStyle=col;
  [[0,-.7,.3],[-.2,-.58,.22],[.2,-.58,.22],[0,-.9,.2]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(x+dx*h,y+dy*h,r*h,0,TAU);c.fill()})};
 const row=(yb,hmin,hmax,gap,cols)=>{for(let x=-20;x<W+30;x+=gap*R(.7,1.3)){
  const h=R(hmin,hmax),col=cols[(Math.random()*cols.length)|0],y=yb+R(-6,6);Math.random()<.65?pine(x,y,h,col):oak(x,y,h,col)}};
 const fog=(y0,y1,a)=>{const f=c.createLinearGradient(0,y0,0,y1);f.addColorStop(0,'rgba(255,228,212,0)');f.addColorStop(1,`rgba(255,228,212,${a})`);c.fillStyle=f;c.fillRect(0,y0,W,y1-y0)};
 hill(H*.62,H*.05,'#a9c8c0',1);hill(H*.68,H*.045,'#8fb8a4',3);
 row(H*.7,H*.12,H*.2,H*.045,['#6f9d8a','#78a690']);fog(H*.45,H*.76,.55);
 row(H*.8,H*.2,H*.34,H*.07,['#3f7a58','#4b8a5f','#357050']);fog(H*.55,H*.84,.3);
 row(H*.9,H*.3,H*.46,H*.11,['#245a3c','#2d6a45','#1f5236']);
 c.fillStyle='#2c6b3b';c.fillRect(0,H*.9,W,H*.1);
}
const clouds=[...Array(5)].map(()=>({x:Math.random(),y:.06+Math.random()*.25,s:.6+Math.random()*.7,v:.004+Math.random()*.006}));
const birds=[...Array(7)].map(()=>({x:Math.random(),y:.08+Math.random()*.25,s:5+Math.random()*5,v:.02+Math.random()*.02,ph:Math.random()*6}));
const flies=[...Array(6)].map((_,i)=>({cx:R(.08,.92),cy:R(.55,.85),r:R(30,70),ph:R(0,6),col:['#ff9ec0','#ffd25e','#c9a0ff'][i%3]}));
const rab={x:.3,dir:1};
function backdrop(t){
 const tt=reduce?0:t,sg=g.createLinearGradient(0,0,0,H*.75);
 sg.addColorStop(0,'#86c3ea');sg.addColorStop(.55,'#ffd9c9');sg.addColorStop(1,'#ffc58f');
 g.fillStyle=sg;g.fillRect(0,0,W,H);
 const sx=W*.78,sy=H*.2,sr=Math.max(34,Math.min(W,H)*.075),gl=g.createRadialGradient(sx,sy,sr*.5,sx,sy,sr*5);
 gl.addColorStop(0,'rgba(255,240,180,.85)');gl.addColorStop(1,'rgba(255,220,150,0)');
 g.fillStyle=gl;g.beginPath();g.arc(sx,sy,sr*5,0,TAU);g.fill();
 g.save();g.translate(sx,sy);g.rotate(tt*.05);g.fillStyle='rgba(255,236,170,.22)';
 for(let i=0;i<12;i++){g.rotate(TAU/12);g.beginPath();g.moveTo(0,-sr*1.2);g.lineTo(-sr*.28,-sr*4.2);g.lineTo(sr*.28,-sr*4.2);g.fill()}
 g.restore();
 g.fillStyle='#fff3b0';g.beginPath();g.arc(sx,sy,sr*(1+Math.sin(tt*1.2)*.04),0,TAU);g.fill();
 clouds.forEach(c=>{const x=((c.x+tt*c.v)%1.3-.15)*W,y=c.y*H,s=c.s*H*.05;g.fillStyle='rgba(255,255,255,.82)';
  [[0,0,1],[1.1,.2,.8],[-1.1,.25,.75],[.5,-.5,.8],[-.5,-.35,.7]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(x+dx*s,y+dy*s,r*s,0,TAU);g.fill()})});
 g.drawImage(fo,0,0,W,H);
 g.strokeStyle='#4a3548';g.lineWidth=1.8;g.lineCap='round';
 birds.forEach(b=>{const x=((b.x+tt*b.v)%1.2-.1)*W,y=b.y*H+Math.sin(tt+b.ph)*10,f=Math.sin(tt*7+b.ph)*b.s*.7,s=b.s*1.4;
  g.beginPath();g.moveTo(x-s,y+f);g.quadraticCurveTo(x-s*.4,y-s*.5,x,y);g.quadraticCurveTo(x+s*.4,y-s*.5,x+s,y+f);g.stroke()});
}
function deer(x,y,s,tt){
 g.save();g.translate(x,y);g.scale(s,s);g.lineCap='round';
 const hd=Math.sin(tt*.8)*2;
 g.strokeStyle='#8a5a38';g.lineWidth=5;
 [[-26,-48,-28,0],[-16,-46,-14,0],[18,-46,16,0],[28,-48,30,0]].forEach(([a,b,c,d])=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()});
 g.fillStyle='#b27a4c';g.beginPath();g.ellipse(0,-56,38,18,0,0,TAU);g.fill();
 g.fillStyle='#f3dcc0';g.beginPath();g.ellipse(2,-47,30,7,0,0,TAU);g.fill();
 g.fillStyle='rgba(255,255,255,.75)';
 [[-18,-62],[-4,-66],[10,-64],[-10,-55],[6,-58],[20,-60]].forEach(([a,b])=>{g.beginPath();g.arc(a,b,1.9,0,TAU);g.fill()});
 g.strokeStyle='#b27a4c';g.lineWidth=11;g.beginPath();g.moveTo(28,-62);g.lineTo(46,-86+hd);g.stroke();
 g.fillStyle='#b27a4c';g.beginPath();g.ellipse(54,-90+hd,12,7,.45,0,TAU);g.fill();
 g.fillStyle='#8a5a38';g.beginPath();g.ellipse(46,-98+hd,3.5,8,-.5,0,TAU);g.fill();
 g.fillStyle='#3a2418';g.beginPath();g.arc(58,-93+hd,1.8,0,TAU);g.fill();g.beginPath();g.arc(63,-87+hd,1.8,0,TAU);g.fill();
 g.fillStyle='#fff';g.beginPath();g.ellipse(-37,-62,4,6,.4,0,TAU);g.fill();
 g.restore();
}
function rabbit(tt){
 if(!reduce){rab.x+=rab.dir*.35;if(rab.x>W-40)rab.dir=-1;if(rab.x<40)rab.dir=1}
 const u=clamp(H/700,.8,1.5),hop=-Math.abs(Math.sin(tt*4))*14*u;
 g.save();g.translate(rab.x,base-4+hop);g.scale(rab.dir*u,u);
 g.fillStyle='#f1e7de';
 g.beginPath();g.ellipse(0,-14,16,11,0,0,TAU);g.fill();
 g.beginPath();g.arc(-16,-15,5,0,TAU);g.fill();
 g.beginPath();g.ellipse(14,-24,8,7,0,0,TAU);g.fill();
 g.beginPath();g.ellipse(12,-38,3,9,.2,0,TAU);g.fill();
 g.beginPath();g.ellipse(18,-37,3,9,.4,0,TAU);g.fill();
 g.fillStyle='#f4a6b8';g.beginPath();g.ellipse(12,-38,1.4,6,.2,0,TAU);g.fill();g.beginPath();g.arc(21,-24,1.3,0,TAU);g.fill();
 g.fillStyle='#3a2418';g.beginPath();g.arc(17,-26,1.4,0,TAU);g.fill();
 g.restore();
}
function critters(t){
 const tt=reduce?0:t;
 deer(Math.max(W*.13,64),base-6,clamp(H/760,.75,1.4),tt);
 rabbit(tt);
 flies.forEach(f=>{const x=f.cx*W+Math.sin(tt*.5+f.ph)*f.r,y=f.cy*H+Math.sin(tt*.8+f.ph*1.3)*f.r*.5,w=Math.abs(Math.sin(tt*10+f.ph))*6+1;
  g.fillStyle=f.col;g.beginPath();g.ellipse(x-w*.8,y,w,5,.3,0,TAU);g.fill();g.beginPath();g.ellipse(x+w*.8,y,w,5,-.3,0,TAU);g.fill();
  g.fillStyle='#4a3548';g.fillRect(x-.8,y-4,1.6,8)});
}
function frame(now){
 const t=now/1000;tNow=t;wind+=((px-.5)*2-wind)*.03;labels=[];
 backdrop(t);
 sparks.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(t*s.sp+s.ph));
  g.globalAlpha=a*.8;g.fillStyle=star;g.beginPath();g.arc(s.x+Math.sin(t*.3+s.ph)*14,s.y+Math.cos(t*.25+s.ph)*10,s.r,0,TAU);g.fill()});
 g.globalAlpha=1;
 ground();
 blades.forEach(b=>{const gp=reduce?1:out(clamp((t-b.delay)/2)),hh=b.h*gp,tx=b.x+(reduce?0:Math.sin(t*1.3+b.ph)*5+wind*6);
  g.strokeStyle=`hsl(${b.hue},45%,${28+b.h/4}%)`;g.lineWidth=1.6;g.beginPath();g.moveTo(b.x,base+6);g.quadraticCurveTo(b.x,base-hh*.6,tx,base-hh);g.stroke()});
 critters(t);
 if(!planted){ // semilla luminosa: invita a tocar
  const a=.5+.5*Math.sin(t*2.6),cy=base-8,sg=g.createRadialGradient(W/2,cy,0,W/2,cy,26+14*a);
  sg.addColorStop(0,star);sg.addColorStop(1,'rgba(255,200,120,0)');
  g.globalAlpha=.55+.4*a;g.fillStyle=sg;g.beginPath();g.arc(W/2,cy,26+14*a,0,TAU);g.fill();g.globalAlpha=1;
 }
 roses.forEach(r=>rose(r,t));
 labels.forEach(l=>label(...l));
 if(!reduce){
  if(petals.length<40&&Math.random()<.04)spawn(R(0,W),-10);
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];
   p.y+=p.vy;p.x+=p.vx+wind*1.2+Math.sin(p.y*.012+p.rot)*.5;p.rot+=p.vr;
   if(p.y>H+20){petals.splice(i,1);continue}
   g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,.35+.65*Math.abs(Math.cos(p.rot*1.7)));
   g.fillStyle=`hsla(${p.hue},80%,52%,.85)`;g.beginPath();g.ellipse(0,0,p.s,p.s*.62,0,0,TAU);g.fill();g.restore()}
 }
 requestAnimationFrame(frame);
}
addEventListener('pointermove',e=>{px=e.clientX/W});
cv.addEventListener('pointerdown',e=>{
 if(planted>=MAX)return;
 const hgt=clamp(base-e.clientY,H*.18,H*.58),sz=clamp(W/20,26,40)+R(0,8);
 const r=mk(e.clientX,hgt,tNow,sz,HUES[planted%HUES.length],2.8,WORDS[planted]);
 planted++;r.last=planted===MAX;roses.push(r);
});
size();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
